<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="mobile.css">
  <link rel="icon" type="image/png" href="logo2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — O Foods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0D0D0D;
      --bg2: #141414;
      --bg3: #1A1A1A;
      --red: #d40d0d;
      --red2: #e83030;
      --gold: #E8B84B;
      --green: #2D6A35;
      --err: #E03535;
      --text: #F5F0E8;
      --muted: #7A7068;
      --border: rgba(255, 255, 255, 0.07);
      --card: #1C1C1C;
      --r: 18px;
      --r2: 12px;
      --nav-bg: #131921;
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      padding-top: 60px;
      visibility: hidden;
    }

   #cur { display: none }
#cur.big { display: none }

    #topnav-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 500
    }

    #topnav {
      background: var(--nav-bg);
      display: flex;
      align-items: center;
      padding: 0 10px;
      height: 60px;
      gap: 2px;
    }
    @media(max-width:768px){
    #topnav{padding:0 6px;gap:2px}
    .nav-search{margin:0 6px;height:38px}
    .nav-location{display:none}
    .ni-top{font-size:10px}
    .ni-bot{font-size:11px}
    .cart-label{display:none}
    .nav-logo img{height:32px}
  }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: -.5px;
      padding: 5px 9px;
      border: 2px solid transparent;
      border-radius: 3px;
      flex-shrink: 0;
      transition: border-color .15s;
    }

    .nav-logo:hover {
      border-color: #fff
    }

    .nav-search {
      flex: 1;
      display: flex;
      height: 44px;
      margin: 0 12px;
      border-radius: 50px;
      overflow: hidden;
      min-width: 0;
      background: #fff;
      border: 2px solid transparent;
      transition: border-color .2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }

    .nav-search:focus-within {
      border-color: var(--red);
    }

    .search-icon-left {
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: #fff;
      flex-shrink: 0;
    }

    .search-input-nav {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: #111;
      background: #fff;
      padding: 0 8px;
      min-width: 0;
    }

    .search-input-nav::placeholder {
      color: #999;
    }

    .search-go {
      background: #fff;
      border: none;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-left: 1px solid #eee;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5px 9px;
      border: 2px solid transparent;
      border-radius: 3px;
      text-decoration: none;
      flex-shrink: 0;
      transition: border-color .15s;
      white-space: nowrap;
    }

    .nav-item:hover {
      border-color: #fff
    }

    .ni-top {
      font-size: 11px;
      color: rgba(255, 255, 255, .65);
      line-height: 1.3
    }

    .ni-bot {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      line-height: 1.4
    }

    .nav-cart-link {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 5px 9px;
      border: 2px solid #fff;
      border-radius: 3px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .cart-icon-wrap {
      position: relative;
      display: inline-flex
    }

    #nav-badge {
      position: absolute;
      top: -4px;
      right: -5px;
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .cart-label {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      padding-bottom: 3px
    }

    /* PAGE */
    .page-top {
      padding: 36px 48px 0;
      display: flex;
      align-items: center;
      gap: 16px
    }

    .back-a {
      width: 40px;
      height: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      font-size: 18px;
      transition: border-color .2s, color .2s
    }

    .back-a:hover {
      border-color: var(--red);
      color: var(--red)
    }

    .page-h {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px
    }

    .page-h span {
      color: var(--red)
    }

    .page-sub {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto
    }

    /* LAYOUT */
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 28px;
      padding: 28px 48px 60px;
      align-items: start
    }

    /* CART ITEMS */
    .sec-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 18px
    }

    .ci {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      transition: border-color .2s, box-shadow .2s
    }

    .ci:hover {
      border-color: rgba(212, 13, 13, .25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, .3)
    }

    .ci-em {
      font-size: 46px;
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg2);
      border-radius: 12px;
      border: 1px solid var(--border)
    }

    .ci-info {
      flex: 1;
      min-width: 0
    }

    .ci-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.2
    }

    .ci-unit {
      font-size: 12px;
      color: var(--muted)
    }

    .ci-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px
    }

    .ci-price {
      font-size: 20px;
      font-weight: 700;
      color: var(--red)
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .qb {
      width: 30px;
      height: 30px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      color: var(--text);
      cursor: pointer
    }

    .qb:hover {
      background: var(--red);
      border-color: var(--red)
    }

    .qn {
      font-weight: 700;
      font-size: 14px;
      min-width: 20px;
      text-align: center
    }

    .ci-rm {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-family: 'Outfit', sans-serif;
      transition: color .2s;
      cursor: pointer
    }

    .ci-rm:hover {
      color: var(--err)
    }

    .add-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 8px;
      transition: opacity .2s
    }

    .add-more:hover {
      opacity: .7
    }

    /* EMPTY */
    .empty-cart {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 80px 32px;
      text-align: center
    }

    .empty-cart div {
      font-size: 64px;
      margin-bottom: 20px
    }

    .empty-cart h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px
    }

    .empty-cart p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px
    }

    .btn-p {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 13px 28px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background .2s, transform .15s;
      box-shadow: 0 0 24px rgba(212, 13, 13, .3)
    }

    .btn-p:hover {
      background: var(--red2);
      transform: translateY(-1px)
    }

    /* SUMMARY PANEL */
    .cp {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 28px;
      position: sticky;
      top: 72px
    }

    .cp-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 22px
    }

    /* STORE BOX */
    .store-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      padding: 16px;
      margin-bottom: 20px
    }

    .sb-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 6px
    }

    .sb-val {
      font-size: 14px;
      font-weight: 600;
      color: var(--text)
    }

    .sb-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px
    }

    /* ITEMS MINI LIST */
    .cp-items-list {
      margin-bottom: 18px;
      max-height: 160px;
      overflow-y: auto
    }

    .cp-il {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 8px;
      color: var(--muted)
    }

    .cp-il span:last-child {
      font-weight: 600;
      color: var(--text)
    }

    /* TOTALS */
    .cp-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px
    }

    .cp-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin: 14px 0 8px
    }

    /* PROMO HINT */
    .promo-hint {
      background: rgba(232, 184, 75, .06);
      border: 1px solid rgba(232, 184, 75, .2);
      border-radius: var(--r2);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px
    }

    /* CHECKOUT BUTTON */
    .btn-checkout {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: var(--r2);
      padding: 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      transition: background .2s, transform .15s;
      box-shadow: 0 0 28px rgba(212, 13, 13, .3);
      cursor: pointer
    }

    .btn-checkout:hover:not(:disabled) {
      background: var(--red2);
      transform: translateY(-1px)
    }

    .btn-checkout:disabled {
      background: var(--muted);
      opacity: .5;
      box-shadow: none;
      transform: none;
      cursor: pointer
    }

    .pay-logos {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
      flex-wrap: wrap
    }

    .plogo {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted)
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50px;
      padding: 13px 28px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
      z-index: 9998;
      pointer-events: none;
      transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
      white-space: nowrap
    }

    #toast.show {
      transform: translateX(-50%) translateY(0)
    }

    @media(max-width:900px) {
      .page-top {
        padding: 28px 20px 0
      }

      .cart-layout {
        grid-template-columns: 1fr;
        padding: 20px 20px 48px
      }

      .cp {
        position: static
      }
    }
  </style>
</head>
<script>
  // Hard auth block — runs before page renders
  (function () {
    if (!localStorage.getItem('of_token')) {
      location.replace('login.html?next=cart.html');
    }
  })();
</script>

        { id: 58, name: 'Beetroot Vadiyalu',           price: 65,  img: 'beetroot vadiyalu.png',        emoji: '🟣', cat: 'papad' },

        { id: 74, name: 'Gavvalu',                     price: 55,  img: 'Gavvalu.png',                  emoji: '🐚', cat: 'snacks' },
        { id: 75, name: 'Kajalu',                      price: 60,  img: 'kajalu.png',                   emoji: '🌙', cat: 'snacks' },
        { id: 76, name: 'Mithai Boondi',               price: 49,  img: 'Mithai Boondi.png',            emoji: '🟠', cat: 'snacks' },
        { id: 77, name: 'Ariselu',                     price: 65,  img: 'sununda.png',                  emoji: '🔵', cat: 'snacks' },
        { id: 78, name: 'Kajjikayalu',                 price: 70,  img: 'nuvula laddu.png',             emoji: '🌙', cat: 'snacks' },
        { id: 79, name: 'Chalimidi',                   price: 55,  img: 'salimidi.png',                 emoji: '🤍', cat: 'snacks' },
      ],
      getUser() { try { return JSON.parse(localStorage.getItem('of_user') || 'null') } catch (e) { return null } },
      cartKey() { const u = this.getUser(); return u ? 'of_cart_' + u.id : 'of_cart_guest' },
      getCart() { try { return JSON.parse(localStorage.getItem(this.cartKey()) || '{}') } catch (e) { return {} } },
      saveCart(c) { localStorage.setItem(this.cartKey(), JSON.stringify(c)) },
      setQty(id, q) { const c = this.getCart(); if (q <= 0) delete c[id]; else c[id] = q; this.saveCart(c) },
      cartCount() { return Object.values(this.getCart()).reduce((a, b) => a + b, 0) },
      refreshBadge() { const el = document.getElementById('nav-badge'); if (el) { const n = this.cartCount(); el.textContent = n; el.style.display = n > 0 ? 'flex' : 'none' } },
      getPrefs() { try { return JSON.parse(localStorage.getItem('of_prefs') || '{}') } catch (e) { return {} } },
      savePrefs(p) { localStorage.setItem('of_prefs', JSON.stringify(p)) },
      _tt: null,
      toast(msg) { const t = document.getElementById('toast'); if (!t) return; t.innerHTML = msg; t.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('show'), 2800) },
    };

    // ── HELPER: get meta stored by product page when item was added ──
    function getMeta(key) {
      try { return JSON.parse(localStorage.getItem('of_cart_meta_' + key) || 'null'); } catch (e) { return null; }
    }

    // ── HELPER: resolve item info from cart key (supports both old numeric keys and new size keys) ──
    function getItemInfo(key, cart) {
      const meta = getMeta(key);
      const parts = key.split('_');
      const pid = parseInt(parts[0]);
      const sizeLabel = parts.slice(1).join('_') || '';
      const p = OF.products.find(x => x.id == pid);
      return {
        name:  meta ? meta.name  : (p ? p.name + (sizeLabel ? ' (' + sizeLabel + ')' : '') : key),
        price: meta ? meta.price : (p ? p.price : 0),
        emoji: meta ? meta.emoji : (p ? p.emoji : ''),
        img:   meta ? meta.img   : (p ? p.img   : ''),
        qty:   cart[key]
      };
    }

    // ── HELPER: compute cart total using meta prices ──
    function cartTotalNew() {
      const cart = OF.getCart();
      return Object.keys(cart).filter(k => cart[k] > 0).reduce((sum, key) => {
        const info = getItemInfo(key, cart);
        return sum + info.price * info.qty;
      }, 0);
    }

    function updateStoreBox() {
      const sb = document.getElementById('store-box');
      if (!sb) return;
      const mode = (typeof DeliveryMode !== 'undefined') ? DeliveryMode.get() : null;
      if (mode === 'pickup') {
        const store = (typeof DeliveryMode !== 'undefined') ? DeliveryMode.getSelectedStore() : null;
        const sName = store ? store.name : 'O Foods Store';
        const sAddr = store ? store.address : '';
        sb.innerHTML =
          '<div class="sb-lbl">Store Pickup</div>' +
          '<div class="sb-val">' + sName + '</div>' +
          '<div class="sb-sub">' + sAddr + '</div>' +
          '<div style="margin-top:8px;font-size:11px;color:#6BCF7F;font-weight:600">Ready next day by 4:00 PM - FREE pickup</div>';
      } else {
        sb.innerHTML =
          '<div class="sb-lbl">Home Delivery</div>' +
          '<div class="sb-val">All India</div>' +
          '<div class="sb-sub">Courier delivery - 4 to 5 business days</div>' +
          '<div style="margin-top:8px;font-size:11px;color:var(--muted)">Delivery charges calculated at checkout based on your state</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('of_token');
      if (!token) { location.href = 'login.html?next=cart.html'; return; }
      document.body.style.visibility = 'visible';

      const user = OF.getUser();
      const li = document.getElementById('nav-user-li');
      if (user && li) {
        li.querySelector('.ni-top').textContent = 'Hello, ' + user.name.split(' ')[0];
        li.querySelector('.ni-bot').textContent = 'Account & Orders';
      }
      OF.refreshBadge();
      if (typeof DeliveryMode !== 'undefined') {
        DeliveryMode.init();
        window.addEventListener('delivery-mode-changed', function () {
          updateStoreBox();
        });
      }
      renderPage();
      const cur = document.getElementById('cur');
      if (cur) {
        document.addEventListener('mousemove', e => { cur.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px) translate(-50%,-50%)'; });
        document.addEventListener('mouseover', e => { cur.classList.toggle('big', !!e.target.closest('a,button,select,input')); });
      }
    });

    function renderPage() {
      const cart = OF.getCart();
      const keys = Object.keys(cart).filter(k => cart[k] > 0);

      updateStoreBox();

      if (!keys.length) {
        document.getElementById('items-lbl').textContent = '';
        document.getElementById('page-sub').textContent = '';
        document.getElementById('items-list').innerHTML =
          '<div class="empty-cart">' +
          '<div>&#128717;</div>' +
          '<h3>Your cart is empty</h3>' +
          '<p>Add something delicious from our menu!</p>' +
          '<a href="memu.html" class="btn-p">Browse Menu</a>' +
          '</div>';
        document.getElementById('add-more').innerHTML = '';
        document.getElementById('cp-items-list').innerHTML = '';
        document.getElementById('chk-btn').disabled = true;
        document.getElementById('chk-btn').textContent = 'Cart is empty';
        document.getElementById('cp-fee').textContent = '₹' + fee;
        updateTotals();
        
        return;
      }

      document.getElementById('items-lbl').textContent = keys.length + ' item' + (keys.length > 1 ? 's' : '') + ' in cart';
      document.getElementById('page-sub').textContent = keys.length + ' item' + (keys.length > 1 ? 's' : '');

      document.getElementById('items-list').innerHTML = keys.map(key => {
        const info = getItemInfo(key, cart);
        return `<div class="ci">
          <div class="ci-em">
            ${info.img
              ? `<img src="${info.img}" alt="${info.name}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;">`
              : info.emoji}
          </div>
          <div class="ci-info">
            <div class="ci-name">${info.name}</div>
            <div class="ci-unit">₹${info.price} per item</div>
          </div>
          <div class="ci-right">
            <div class="ci-price">₹${info.price * info.qty}</div>
            <div class="qty-ctrl">
              <button class="qb" onclick="doQty('${key}',-1)">&#8722;</button>
              <span class="qn">${info.qty}</span>
              <button class="qb" onclick="doQty('${key}',1)">&#43;</button>
            </div>
            <button class="ci-rm" onclick="doRemove('${key}')">&#x2715; Remove</button>
          </div>
        </div>`;
      }).join('');

      document.getElementById('add-more').innerHTML = '<a href="memu.html" class="add-more">+ Add more items</a>';

      document.getElementById('cp-items-list').innerHTML = keys.map(key => {
        const info = getItemInfo(key, cart);
        return `<div class="cp-il">
          <span>${info.img
            ? `<img src="${info.img}" alt="" style="width:20px;height:20px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:4px;">`
            : info.emoji} ${info.name} x${info.qty}</span>
          <span>₹${info.price * info.qty}</span>
        </div>`;
      }).join('');

      document.getElementById('chk-btn').disabled = false;
      document.getElementById('chk-btn').textContent = 'Proceed to Checkout';
      updateTotals();
    }

    function updateTotals() {
  const sub = cartTotalNew();
  document.getElementById('cp-sub').textContent = '₹' + sub;
  function calcPlatformFee(sub) {
    if (sub <= 500) return 10;
    if (sub <= 1000) return 30;
    if (sub <= 1500) return 50;
    return 50;
  }
  const fee = sub > 0 ? calcPlatformFee(sub) : 0;
  document.getElementById('cp-fee').textContent = '₹' + fee;
  document.getElementById('cp-total').textContent = '₹' + (sub + fee);
}

    function doQty(key, delta) {
      const c = OF.getCart();
      const newQty = (c[key] || 0) + delta;
      if (newQty <= 0) delete c[key]; else c[key] = newQty;
      OF.saveCart(c);
      OF.refreshBadge();
      renderPage();
    }

    function doRemove(key) {
      const c = OF.getCart();
      delete c[key];
      OF.saveCart(c);
      OF.refreshBadge();
      OF.toast('Item removed from cart');
      renderPage();
    }

    function proceedToCheckout() {
      const cart = OF.getCart();
      const keys = Object.keys(cart).filter(k => cart[k] > 0);
      if (!keys.length) { OF.toast('Your cart is empty!'); return; }

      const user = OF.getUser();
      let addr = {};
      try { addr = typeof user.address === 'string' ? JSON.parse(user.address) : (user.address || {}); } catch (e) { }
      const addrStr = [addr.house, addr.street, addr.city, addr.state, addr.pincode].filter(Boolean).join(', ');
      const sub = cartTotalNew();

      const orderData = {
        items: keys.map(key => {
          const info = getItemInfo(key, cart);
          return { id: key, name: info.name, emoji: info.emoji, img: info.img, price: info.price, qty: info.qty };
        }),
        subtotal: sub,
        deliveryAddress: addrStr || '',
      };

      localStorage.setItem('of_buynow', JSON.stringify(orderData));
      document.getElementById('chk-btn').textContent = 'Loading...';
      document.getElementById('chk-btn').disabled = true;
      setTimeout(() => location.href = 'Checkout.html', 300);
    }

  </script>

  <script src="delivery-mode.js"></script>
</body>

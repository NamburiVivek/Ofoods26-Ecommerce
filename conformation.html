<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="logo2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — O Foods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0D0D0D;
      --bg2: #141414;
      --bg3: #1A1A1A;
      --red: #d40d0d;
      --red2: #e83030;
      --gold: #E8B84B;
      --green: #2D6A35;
      --green-light: #6BCF7F;
      --text: #F5F0E8;
      --muted: #7A7068;
      --border: rgba(255, 255, 255, 0.07);
      --card: #1C1C1C;
      --r: 18px;
      --r2: 12px;
      --nav-bg: #131921;
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      padding-top: 60px;
      cursor: default
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(45, 106, 53, .06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAVBAR */
    #topnav-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 500
    }

    #topnav {
      background: var(--nav-bg);
      display: flex;
      align-items: center;
      padding: 0 10px;
      height: 60px;
      gap: 2px;
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: -.5px;
      padding: 5px 9px;
      border: 2px solid transparent;
      border-radius: 3px;
      flex-shrink: 0;
      transition: border-color .15s;
    }

    .nav-logo:hover {
      border-color: #fff
    }

    .nav-search {
      flex: 1;
      display: flex;
      height: 44px;
      margin: 0 12px;
      border-radius: 50px;
      overflow: hidden;
      min-width: 0;
      background: #fff;
      border: 2px solid transparent;
      transition: border-color .2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }

    .nav-search:focus-within {
      border-color: var(--red);
    }

    .search-icon-left {
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: #fff;
      flex-shrink: 0;
    }

    .search-input-nav {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: #111;
      background: #fff;
      padding: 0 8px;
      min-width: 0;
    }

    .search-input-nav::placeholder {
      color: #999;
    }

    .search-go {
      background: #fff;
      border: none;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-left: 1px solid #eee;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5px 9px;
      border: 2px solid transparent;
      border-radius: 3px;
      text-decoration: none;
      flex-shrink: 0;
      transition: border-color .15s;
      white-space: nowrap;
    }

    .nav-item:hover {
      border-color: #fff
    }

    .ni-top {
      font-size: 11px;
      color: rgba(255, 255, 255, .65);
      line-height: 1.3
    }

    .ni-bot {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      line-height: 1.4
    }

    .nav-cart-link {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 5px 9px;
      border: 2px solid transparent;
      border-radius: 3px;
      text-decoration: none;
      flex-shrink: 0;
      transition: border-color .15s;
    }

    .nav-cart-link:hover {
      border-color: #fff
    }

    .cart-icon-wrap {
      position: relative;
      display: inline-flex
    }

    #nav-badge {
      position: absolute;
      top: -4px;
      right: -5px;
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .cart-label {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      padding-bottom: 3px
    }

    /* SUCCESS HERO */
    .success-hero {
      background: linear-gradient(140deg, #0A1800 0%, #1A2A08 50%, #081A10 100%);
      padding: 52px 48px 44px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(45, 106, 53, .2);
    }

    .success-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(45, 106, 53, .25) 0%, transparent 70%)
    }

    .check-anim {
      width: 80px;
      height: 80px;
      background: rgba(45, 106, 53, .2);
      border: 2px solid rgba(45, 106, 53, .45);
      border-radius: 50%;
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      position: relative;
      z-index: 1;
      animation: popIn .5s .2s cubic-bezier(.34, 1.56, .64, 1) both
    }

    .sh-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
      animation: fadeUp .5s .35s both
    }

    .sh-sub {
      color: var(--muted);
      font-size: 15px;
      position: relative;
      z-index: 1;
      animation: fadeUp .5s .5s both
    }

    .order-badge {
      display: inline-block;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 50px;
      padding: 7px 22px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-top: 16px;
      position: relative;
      z-index: 1;
      letter-spacing: 1px;
      animation: fadeUp .5s .65s both
    }

    /* CONTENT */
    .conf-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 40px 60px;
      position: relative;
      z-index: 1;
    }

    /* SECTION CARD */
    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 20px;
      overflow: hidden;
      animation: fadeUp .5s ease both;
    }

    .section-card:nth-child(1) { animation-delay: .1s }
    .section-card:nth-child(2) { animation-delay: .2s }
    .section-card:nth-child(3) { animation-delay: .3s }

    .sc-header {
      padding: 20px 28px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sc-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .sc-icon.green {
      background: rgba(45, 106, 53, .15);
      border: 1px solid rgba(45, 106, 53, .25);
    }

    .sc-icon.red {
      background: rgba(212, 13, 13, .12);
      border: 1px solid rgba(212, 13, 13, .2);
    }

    .sc-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .sc-title em {
      color: var(--red);
      font-style: italic;
    }

    .sc-body {
      padding: 20px 28px 24px;
    }

    /* ORDER TIMELINE GRID */
    .timeline-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    .tg-item {
      background: rgba(255, 255, 255, .025);
      border: 1px solid rgba(255, 255, 255, .05);
      border-radius: 14px;
      padding: 18px 20px;
      position: relative;
      transition: all .3s;
    }

    .tg-item:hover {
      border-color: rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .04);
    }

    .tg-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tg-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .tg-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .tg-item.active {
      border-color: rgba(45, 106, 53, .3);
      background: rgba(45, 106, 53, .06);
    }

    .tg-item.active .tg-value {
      color: var(--green-light);
    }

    .tg-item.pending {
      border-color: rgba(255, 255, 255, .04);
      opacity: .7;
    }

    .tg-item.pending .tg-value {
      color: var(--muted);
    }

    /* STATUS PROGRESS */
    .status-bar {
      margin-top: 20px;
      background: var(--bg2);
      border-radius: 8px;
      height: 6px;
      overflow: hidden;
      position: relative;
    }

    .status-bar-fill {
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--green), var(--green-light));
      transition: width 1s ease;
      position: relative;
    }

    .status-bar-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: -2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green-light);
      box-shadow: 0 0 12px var(--green-light);
    }

    .status-text {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      padding: 10px 16px;
      border-radius: 10px;
    }

    .status-text.preparing {
      background: rgba(212, 13, 13, .08);
      border: 1px solid rgba(212, 13, 13, .15);
      color: var(--red);
    }

    .status-text.dispatched {
      background: rgba(232, 184, 75, .08);
      border: 1px solid rgba(232, 184, 75, .15);
      color: var(--gold);
    }

    .status-text.delivered {
      background: rgba(45, 106, 53, .1);
      border: 1px solid rgba(45, 106, 53, .2);
      color: var(--green-light);
    }

    /* ORDER ITEMS */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border)
    }

    .item-row:last-of-type {
      border-bottom: none
    }

    .ir-left {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .ir-em {
      font-size: 24px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      flex-shrink: 0;
    }

    .ir-name {
      font-size: 14px;
      font-weight: 600
    }

    .ir-qty {
      font-size: 11px;
      color: var(--muted)
    }

    .ir-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--red);
      flex-shrink: 0;
    }

    .total-lines {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border)
    }

    .tl-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px
    }

    .tl-row.grand {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border)
    }

    .tl-row.disc {
      color: var(--green-light)
    }

    /* DELIVERY INFO BAR */
    .delivery-info {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, .02);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .delivery-info-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(45, 106, 53, .12);
      border: 1px solid rgba(45, 106, 53, .2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .delivery-info-text {
      flex: 1;
    }

    .delivery-info-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .delivery-info-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    /* ACTIONS */
    .conf-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .btn-p {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 30px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .2s;
      box-shadow: 0 0 24px rgba(212, 13, 13, .3)
    }

    .btn-p:hover {
      background: var(--red2);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(212, 13, 13, .4);
    }

    .btn-o {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 14px 26px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all .2s
    }

    .btn-o:hover {
      border-color: var(--red);
      color: var(--red)
    }

    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50px;
      padding: 13px 28px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
      z-index: 9998;
      pointer-events: none;
      transition: transform .35s cubic-bezier(.34, 1.56, .64, 1)
    }

    #toast.show {
      transform: translateX(-50%) translateY(0)
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.4) }
      to { opacity: 1; transform: scale(1) }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px) }
      to { opacity: 1; transform: translateY(0) }
    }

    @media(max-width:768px) {
      .conf-content { padding: 28px 18px 48px }
      .success-hero { padding: 40px 20px 36px }
      .timeline-grid { grid-template-columns: 1fr }
      .sc-body { padding: 16px 20px 20px }
      .sc-header { padding: 16px 20px 0 }
      .conf-actions { flex-direction: column; align-items: center }
    }
  </style>
</head>

<body>

  <div id="topnav-wrapper">
    <nav id="topnav">
      <a href="memu.html" class="nav-logo">
        <img src="logo2.png" alt="OFoods" style="height:40px;width:auto;display:block;"
          onerror="this.outerHTML='<span style=\'font-family:Cormorant Garamond,serif;font-size:22px;font-weight:700;color:#fff\'>O<span style=\'color:#d40d0d\'>Foods</span></span>'">
      </a>
      <div class="nav-search">
        <div class="search-icon-left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999"
            stroke-width="2.5">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg></div>
        <input type="text" class="search-input-nav" placeholder="Search pickles, spices, papad..." autocomplete="off"
          onkeydown="if(event.key==='Enter')window.location.href='memu.html?q='+encodeURIComponent(this.value)" />
        <button class="search-go" onclick="window.location.href='memu.html'"><svg width="16" height="16"
            viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg></button>
      </div>
      <a href="profile.html" class="nav-item" id="nav-user-li">
        <span class="ni-top">Hello, sign in</span>
        <span class="ni-bot">Account &amp; Lists</span>
      </a>
      <a href="cart.html" class="nav-cart-link">
        <div class="cart-icon-wrap">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 01-8 0" />
          </svg>
          <span id="nav-badge"></span>
        </div>
        <span class="cart-label">Cart</span>
      </a>
    </nav>
  </div>

  <!-- HERO -->
  <div class="success-hero">
    <div class="check-anim">✅</div>
    <div class="sh-title">Order Confirmed!</div>
    <div class="sh-sub" id="hero-sub">Your order is being freshly prepared for delivery</div>
    <div class="order-badge" id="order-badge">Loading…</div>
  </div>

  <div class="conf-content">

    <!-- ORDER TIMELINE -->
    <div class="section-card" id="timeline-card">
      <div class="sc-header">
        <div class="sc-icon green">⏰</div>
        <div class="sc-title">Order <em>Timeline</em></div>
      </div>
      <div class="sc-body">
        <div class="timeline-grid" id="timeline-grid"></div>
        <div class="status-bar" id="status-bar" style="display:none">
          <div class="status-bar-fill" id="status-fill" style="width:10%"></div>
        </div>
        <div class="status-text preparing" id="status-text">Confirming your order…</div>
      </div>
    </div>

    <!-- DELIVERY INFO + ITEMS -->
    <div class="section-card" id="details-card">
      <div class="sc-header">
        <div class="sc-icon red">🛍️</div>
        <div class="sc-title">Order <em>Details</em></div>
      </div>
      <div class="sc-body">
        <div id="delivery-info-container"></div>
        <div id="items-container"></div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="conf-actions">
      <a href="memu.html" class="btn-p">Order Again →</a>
      <a href="profile.html" class="btn-o">My Orders</a>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    function formatTime(date) {
      return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    }
    function formatDateFull(date) {
      return date.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderTimeline(order) {
      const placedDate = order.placedAt ? new Date(order.placedAt) : new Date();
      const isPickup = order.deliveryMethod === 'pickup'
        || order.delivery_method === 'pickup'
        || String(order.slot || '').toLowerCase().includes('pickup')
        || Boolean(order.pickupDate)
        || Boolean(order.pickup_date);

      // ── Compute correct pickup date (next working day, skip Sun) ──
      function getNextWorkingDay(from) {
        const d = new Date(from); d.setHours(0,0,0,0);
        const day = d.getDay();
        if (day === 6) d.setDate(d.getDate() + 2); // Sat→Mon
        else if (day === 0) d.setDate(d.getDate() + 1); // Sun→Mon
        else d.setDate(d.getDate() + 1); // Mon-Fri→next day
        return d;
      }

      // Use stored pickupDate from order if available, otherwise compute
      let pickupReadyDate;
      if (order.pickupDate) {
        pickupReadyDate = new Date(order.pickupDate);
      } else if (order.pickup_date) {
        pickupReadyDate = new Date(order.pickup_date);
      } else {
        pickupReadyDate = getNextWorkingDay(placedDate);
      }
      pickupReadyDate.setHours(16, 0, 0, 0); // 4:00 PM

      const pickupDayLabel = order.pickupDateDisplay
        ? order.pickupDateDisplay
        : pickupReadyDate.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' }) + ' by 4:00 PM';

      let items = [];
      if (isPickup) {
        const now = new Date();
        const isReady = now >= pickupReadyDate;
        items = [
          {
            label: '📋 Order Placed',
            value: formatTime(placedDate),
            sub: formatDateFull(placedDate),
            state: 'active'
          },
          {
            label: '🍳 Preparing',
            value: isReady ? 'Done ✓' : 'In progress',
            sub: 'Your order is being freshly prepared',
            state: 'active'
          },
          {
            label: '🏪 Ready for Pickup',
            value: isReady ? 'Ready Now! ✅' : pickupDayLabel,
            sub: isReady ? 'Visit the store with your Order ID' : "We'll notify you when it's ready",
            state: isReady ? 'active' : 'pending'
          }
        ];
      } else {
        // Home delivery
        const estDate = new Date(placedDate);
        estDate.setDate(estDate.getDate() + 5);
        const dispatchDate = new Date(placedDate);
        dispatchDate.setDate(dispatchDate.getDate() + 2);

        items = [
          {
            label: '📋 Order Date & Time',
            value: formatTime(placedDate),
            sub: formatDateFull(placedDate),
            state: 'active'
          },
          {
            label: '📦 Dispatch',
            value: 'Within 1–2 days',
            sub: 'Tracking details will be sent to your email',
            state: 'pending'
          },
          {
            label: '🚚 Estimated Delivery',
            value: formatDateFull(estDate),
            sub: '4–5 business days from order',
            state: 'pending'
          }
        ];

        const now = new Date();
        const hoursElapsed = (now - placedDate) / (1000 * 60 * 60);
        if (hoursElapsed >= 48) {
          items[1].state = 'active';
          items[1].value = 'Dispatched ✓';
          items[1].sub = 'Your order is on the way!';
        }
        if (hoursElapsed / 24 >= 5) {
          items[2].state = 'active';
          items[2].value = 'Delivered ✅';
          items[2].sub = 'Your order has been delivered!';
        }
      }

      document.getElementById('timeline-grid').innerHTML = items.map(item =>
        `<div class="tg-item ${item.state}">
          <div class="tg-label">${item.label}</div>
          <div class="tg-value">${item.value}</div>
          <div class="tg-sub">${item.sub}</div>
        </div>`
      ).join('');

      // Status bar
      const bar = document.getElementById('status-bar');
      const fill = document.getElementById('status-fill');
      const statusText = document.getElementById('status-text');
      bar.style.display = 'block';

      if (isPickup) {
        const now = new Date();
        const totalPickupMs = pickupReadyDate - placedDate;
        const elapsedPickupMs = now - placedDate;
        const pickupProgress = Math.min(Math.max((elapsedPickupMs / totalPickupMs) * 100, 5), 100);

        if (now >= pickupReadyDate) {
          fill.style.width = '100%';
          statusText.className = 'status-text delivered';
          statusText.textContent = '✅ Your order is ready for pickup! Visit the store with your Order ID.';
        } else {
          fill.style.width = pickupProgress + '%';
          statusText.className = 'status-text preparing';
          statusText.textContent = `🍳 Your order is being freshly prepared — ready on ${pickupDayLabel}`;
        }
      } else {
        const now = new Date();
        const hoursElapsed = (now - placedDate) / (1000 * 60 * 60);
        const daysElapsed = hoursElapsed / 24;

        if (daysElapsed >= 5) {
          fill.style.width = '100%';
          statusText.className = 'status-text delivered';
          statusText.textContent = '✅ Your order has been delivered! Enjoy your food!';
        } else if (hoursElapsed >= 48) {
          fill.style.width = '60%';
          statusText.className = 'status-text dispatched';
          statusText.textContent = '📦 Your order has been dispatched and is on its way!';
        } else {
          fill.style.width = '20%';
          statusText.className = 'status-text preparing';
          statusText.textContent = '🍳 Your order is being freshly prepared and will be dispatched within 1–2 days';
        }
      }
    }

    function renderDetails(order) {
      const subtotal = order.subtotal || 0;
      const discount = order.discount || 0;
      const platformFee = 5;
      const deliveryCharge = order.deliveryCharge || 0;
      const total = order.total != null ? order.total : (subtotal - discount + platformFee + deliveryCharge);
      const isPickup = order.deliveryMethod === 'pickup'
        || order.delivery_method === 'pickup'
        || String(order.slot || '').toLowerCase().includes('pickup')
        || Boolean(order.pickupDate)
        || Boolean(order.pickup_date);

      // Delivery info bars
      const addressVal = order.deliveryAddress || order.store || '—';
      let infoHtml = '';

      infoHtml += `<div class="delivery-info">
        <div class="delivery-info-icon">${isPickup ? '🏪' : '📦'}</div>
        <div class="delivery-info-text">
          <div class="delivery-info-label">${isPickup ? 'Pickup Location' : 'Delivery Address'}</div>
          <div class="delivery-info-value">${addressVal}</div>
        </div>
      </div>`;

      infoHtml += `<div class="delivery-info">
        <div class="delivery-info-icon">${isPickup ? '💵' : '💳'}</div>
        <div class="delivery-info-text">
          <div class="delivery-info-label">Payment</div>
          <div class="delivery-info-value">${order.payMethod === 'upi' ? '📱 UPI — ' + (order.upiId || 'UPI Payment') : (isPickup ? '💵 Cash on Pickup' : '💵 Cash on Delivery')}</div>
        </div>
      </div>`;

      if (isPickup) {
        const pickupText = order.pickupDateDisplay || (order.pickupDate ? formatDateFull(order.pickupDate) + ' by 4:00 PM' : 'Ready next day by 4:00 PM');
        infoHtml += `<div class="delivery-info">
          <div class="delivery-info-icon">📅</div>
          <div class="delivery-info-text">
            <div class="delivery-info-label">Pickup ready</div>
            <div class="delivery-info-value">${pickupText}</div>
          </div>
        </div>`;
      }

      document.getElementById('delivery-info-container').innerHTML = infoHtml;

      // Items + totals
      const itemsHtml = (order.items || []).map(it =>
        `<div class="item-row"><div class="ir-left"><span class="ir-em">${it.emoji || '🍽️'}</span>
        <div><div class="ir-name">${it.name}${it.size ? ' <span style="font-size:10px;color:var(--muted)">(' + it.size + ')</span>' : ''}</div><div class="ir-qty">×${it.qty}</div></div></div>
        <div class="ir-price">₹${(it.price || 0) * it.qty}</div></div>`
      ).join('');

      const deliveryRow = isPickup ? '' : `<div class="tl-row"><span>🚚 Delivery charge</span><span>₹${deliveryCharge}</span></div>`;

      document.getElementById('items-container').innerHTML = `
        ${itemsHtml}
        <div class="total-lines">
          <div class="tl-row"><span>Subtotal</span><span>₹${subtotal}</span></div>
          ${discount > 0 ? '<div class="tl-row disc"><span>Discount ' + (order.promoCode ? '(' + order.promoCode + ')' : '') + '</span><span>-₹' + discount + '</span></div>' : ''}
          <div class="tl-row"><span>Platform fee</span><span>₹${platformFee}</span></div>
          ${deliveryRow}
          <div class="tl-row grand"><span>Total Paid</span><span>₹${total}</span></div>
        </div>`;
    }

    // ── MAIN ──────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const user = JSON.parse(localStorage.getItem('of_user') || 'null');
        const li = document.getElementById('nav-user-li');
        if (user && li) {
          li.querySelector('.ni-top').textContent = 'Hello, ' + user.name.split(' ')[0];
          li.querySelector('.ni-bot').textContent = 'Account & Orders';
        }
        const nb = document.getElementById('nav-badge');
        const cartKey = user ? 'of_cart_' + user.id : 'of_cart_guest';
        const cart = JSON.parse(localStorage.getItem(cartKey) || '{}');
        const n = Object.values(cart).reduce((a, b) => a + b, 0);
        if (nb) { nb.textContent = n; nb.style.display = n > 0 ? 'flex' : 'none'; }
      } catch (e) { }
      if (typeof DeliveryMode !== 'undefined') DeliveryMode.init();

      let order = null;
      try {
        const u = JSON.parse(localStorage.getItem('of_user') || 'null');
        const ordersKey = u ? 'of_orders_' + u.id : 'of_orders_guest';
        const orders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
        order = orders[0] || null;
      } catch (e) { }

      if (!order) {
        document.getElementById('order-badge').textContent = 'No recent order';
        document.getElementById('timeline-grid').innerHTML = '<p style="color:var(--muted);font-size:14px;grid-column:1/-1;text-align:center;padding:20px 0">No order data found. <a href="memu.html" style="color:var(--red)">Place an order →</a></p>';
        document.getElementById('status-text').textContent = '';
        return;
      }

      document.getElementById('order-badge').textContent = 'Order #' + order.id;

      // Adapt hero subtitle
      const isPickup = order.deliveryMethod === 'pickup';
      const heroSub = document.getElementById('hero-sub');
      if (heroSub) heroSub.textContent = isPickup
        ? 'Your order is being prepared — ready for pickup next day by 4:00 PM!'
        : 'Your order is being freshly prepared for delivery';

      renderTimeline(order);
      renderDetails(order);

      // Auto-refresh timeline every 60s to update status dynamically
      setInterval(() => {
        renderTimeline(order);
      }, 60000);

      // Poll server for order status updates
      const pollOrderStatus = async () => {
        const token = localStorage.getItem('of_token');
        if (!token || !order || !order.id) return;
        try {
          const r = await fetch('http://localhost:3000/api/orders/' + order.id + '/status', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const d = await r.json();
          if (d.success && d.status) {
            order.status = d.status;
            renderTimeline(order);
          }
        } catch (e) { }
      };
      setInterval(pollOrderStatus, 30000);
    });
  </script>

  <script src="delivery-mode.js"></script>
</body>

</html>

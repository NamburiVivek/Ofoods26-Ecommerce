<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Products | O Foods</title>
<link rel="icon" type="image/png" href="logo2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D; --bg2:#141414; --bg3:#1A1A1A;
  --card:#1C1C1C; --border:rgba(255,255,255,.07);
  --red:#d40d0d; --red2:#e83030;
  --text:#F5F0E8; --muted:#7A7068; --green:#2D6A35;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:rgba(13,13,13,.9);position:sticky;top:0;z-index:50}
.logout-btn{background:transparent;border:1.5px solid rgba(212,13,13,.5);color:var(--red2);font-size:12px;font-weight:700;padding:8px 18px;border-radius:50px;cursor:pointer}
.logout-btn:hover{background:var(--red);color:#fff}
.page{padding:32px 40px}
.title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;margin-bottom:6px}
.title span{color:var(--red)}
.sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.search-bar{margin-bottom:18px}
.search-bar input{width:100%;max-width:360px;background:var(--bg2);border:1.5px solid #2a2a2a;border-radius:8px;padding:10px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--red)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg2)}
td{padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
.pname{font-weight:600}
.pid{color:var(--muted);font-size:11px}
.size-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.size-row:last-child{margin-bottom:0}
.size-label{width:52px;font-size:12px;color:var(--muted);flex-shrink:0}
input.price-in{width:80px;background:var(--bg2);border:1px solid #2a2a2a;border-radius:6px;padding:6px 8px;color:var(--text);font-size:12px;outline:none}
input.price-in:focus{border-color:var(--red)}
.mrp-label{font-size:11px;color:var(--muted);margin-left:2px}
.save-btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.save-btn:hover{background:var(--red2)}
.save-btn:disabled{background:#3a3a3a;cursor:not-allowed}
.status-msg{font-size:11px;margin-top:4px;min-height:14px}
.status-msg.ok{color:#6BCF7F}
.status-msg.err{color:#ff9b9b}
.loading{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<nav>
  <a href="index.html" style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:#fff;text-decoration:none">O<span style="color:var(--red)">Foods</span> Admin</a>
  <button class="logout-btn" onclick="logout()">Logout</button>
</nav>

<div class="page">
  <div class="title">Product <span>Prices</span></div>
  <div class="sub">Edit a price below and click Save — the change goes live across the entire website immediately.</div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search product name or ID..." oninput="renderTable()">
  </div>

  <div id="table-wrap"><div class="loading">Loading products…</div></div>
</div>

<script>
const API = 'https://ofoods26-ecommerce.vercel.app';
let PRODUCTS = [];

window.addEventListener('DOMContentLoaded', () => {
  const token = localStorage.getItem('of_token');
  if (!token) { location.href = 'AdminLogin.html'; return; }
  loadProducts();
});

function logout() {
  localStorage.removeItem('of_token');
  sessionStorage.removeItem('of_admin_auth');
  location.href = 'AdminLogin.html';
}

async function loadProducts() {
  const token = localStorage.getItem('of_token');
  try {
    const r = await fetch(`${API}/api/admin/products`, { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    if (!d.success) {
      if (r.status === 401 || r.status === 403) { logout(); return; }
      document.getElementById('table-wrap').innerHTML = `<div class="loading">${d.error || 'Failed to load products.'}</div>`;
      return;
    }
    PRODUCTS = d.products;
    renderTable();
  } catch (e) {
    document.getElementById('table-wrap').innerHTML = '<div class="loading">Cannot connect to server.</div>';
  }
}

function renderTable() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  const list = PRODUCTS.filter(p => !q || p.name.toLowerCase().includes(q) || String(p.id).includes(q));

  if (!list.length) {
    document.getElementById('table-wrap').innerHTML = '<div class="loading">No products found.</div>';
    return;
  }

  document.getElementById('table-wrap').innerHTML = `
    <table>
      <thead><tr><th>Product</th><th>Sizes & Prices</th><th>Base Price (no sizes)</th><th></th></tr></thead>
      <tbody>
        ${list.map(p => `
          <tr id="row-${p.id}">
            <td><div class="pname">${p.name}</div><div class="pid">ID: ${p.id}</div></td>
            <td>
              ${(p.sizes && p.sizes.length ? p.sizes : [{label:'—',price:p.price,mrp:p.mrp}]).map((s, i) => `
                <div class="size-row">
                  <span class="size-label">${s.label}</span>
                  ₹<input class="price-in" type="number" min="0" step="1" value="${s.price}" data-pid="${p.id}" data-sidx="${i}" data-field="price">
                  <span class="mrp-label">MRP ₹</span>
                  <input class="price-in" type="number" min="0" step="1" value="${s.mrp || ''}" data-pid="${p.id}" data-sidx="${i}" data-field="mrp" style="width:64px">
                </div>
              `).join('')}
            </td>
            <td>
              ₹<input class="price-in" type="number" min="0" step="1" value="${p.price}" id="base-price-${p.id}">
            </td>
            <td>
              <button class="save-btn" onclick="saveProduct(${p.id})">Save</button>
              <div class="status-msg" id="status-${p.id}"></div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function saveProduct(id) {
  const product = PRODUCTS.find(p => p.id === id);
  if (!product) return;

  const statusEl = document.getElementById('status-' + id);
  const btn = document.querySelector(`#row-${id} .save-btn`);

  // Collect edited size prices
  const sizeInputs = document.querySelectorAll(`input[data-pid="${id}"]`);
  const sizesMap = {};
  sizeInputs.forEach(inp => {
    const idx = inp.dataset.sidx;
    const field = inp.dataset.field;
    if (!sizesMap[idx]) sizesMap[idx] = { ...(product.sizes[idx] || {}) };
    sizesMap[idx][field] = parseFloat(inp.value) || 0;
  });
  const sizes = Object.keys(sizesMap).sort((a,b)=>a-b).map(k => sizesMap[k]);

  const basePrice = parseFloat(document.getElementById('base-price-' + id).value) || 0;

  btn.disabled = true;
  btn.textContent = 'Saving…';
  statusEl.textContent = '';
  statusEl.className = 'status-msg';

  const token = localStorage.getItem('of_token');
  try {
    const r = await fetch(`${API}/api/admin/products/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ price: basePrice, mrp: sizes[0]?.mrp || product.mrp, sizes })
    });
    const d = await r.json();
    if (!d.success) {
      statusEl.textContent = '❌ ' + (d.error || 'Failed to save');
      statusEl.className = 'status-msg err';
    } else {
      statusEl.textContent = '✅ Saved — live on site now';
      statusEl.className = 'status-msg ok';
      product.price = basePrice;
      product.sizes = sizes;
    }
  } catch (e) {
    statusEl.textContent = '❌ Could not reach server';
    statusEl.className = 'status-msg err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}
</script>
</body>
</html>

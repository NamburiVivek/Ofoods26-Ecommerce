<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | O Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo2.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D; --bg2:#141414; --bg3:#1A1A1A;
  --card:#1C1C1C; --card2:#222; --border:rgba(255,255,255,.07);
  --red:#d40d0d; --red2:#e83030;
  --text:#F5F0E8; --muted:#7A7068; --green:#2D6A35;
}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 60% at 70% 0%,rgba(212,13,13,.10) 0%,transparent 70%);
  color:var(--text);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.wrap{width:100%;max-width:440px}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;color:var(--muted);font-size:12px;text-decoration:none;transition:color .2s}
.back:hover{color:var(--red)}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:36px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.brand{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#fff;margin-bottom:18px}
.brand span{color:var(--red)}
.title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px}
.title span{color:var(--red)}
.sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6}
.form-group{margin-bottom:18px}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.in{
  width:100%;background:var(--bg2);
  border:1.5px solid #2a2a2a;border-radius:8px;
  padding:12px 14px;font-family:'Outfit',sans-serif;
  font-size:14px;color:var(--text);outline:none;
  transition:border-color .2s;
}
.in::placeholder{color:#555}
.in:focus{border-color:var(--red)}
.btn{
  width:100%;background:var(--red);color:#fff;border:none;
  border-radius:50px;padding:14px;
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .2s;
  text-transform:uppercase;letter-spacing:.5px;
  box-shadow:0 0 30px rgba(212,13,13,.25);
}
.btn:hover:not(:disabled){background:var(--red2);box-shadow:0 0 40px rgba(212,13,13,.4)}
.btn:disabled{background:#3a3a3a;color:#888;cursor:not-allowed;box-shadow:none}
.result{margin-top:20px;border-radius:10px;padding:14px 18px;font-size:13px;line-height:1.6;display:none}
.result.show{display:block;animation:fadeUp .25s ease}
.result.err{background:rgba(212,13,13,.1);border:1px solid rgba(212,13,13,.3);color:#ff9b9b}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div style="position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;z-index:10;">
  <img src="logo2.png" alt="OFoods" style="height:36px;width:auto;display:block;">
  <a href="index.html" class="back" style="margin:0;">← Back to Home</a>
</div>
<div class="wrap">
  <div class="card">
    <div class="title">Admin <span>Login</span></div>
    <div class="sub">Enter your admin credentials to access the order management panel.</div>

    <div class="form-group">
      <label class="lbl">Email</label>
      <input class="in" type="email" id="admin-email" placeholder="admin@email.com" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="lbl">Password</label>
      <input class="in" type="password" id="admin-password" placeholder="••••••••" autocomplete="off">
    </div>

    <button class="btn" id="btn-login" onclick="adminLogin()">Sign In</button>

    <div class="result" id="result"></div>
  </div>
</div>

<script>
const ADMIN_EMAIL = 'ofoods@26gmail.com';
const ADMIN_PASSWORD = 'Ofoods@26';

function adminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;
  const resultEl = document.getElementById('result');

  resultEl.className = 'result';
  resultEl.innerHTML = '';

  if (!email || !password) {
    resultEl.className = 'result err show';
    resultEl.innerHTML = 'Please enter both email and password.';
    return;
  }

  if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
    sessionStorage.setItem('of_admin_auth', 'true');
    window.location.href = 'admin-orders.html';
  } else {
    resultEl.className = 'result err show';
    resultEl.innerHTML = 'Invalid email or password.';
  }
}

document.getElementById('admin-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') adminLogin();
});
</script>
</body>
</html>

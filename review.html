<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="logo2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews — O Foods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0D0D0D;--bg2:#141414;--bg3:#1A1A1A;--red:#d40d0d;--red2:#e83030;--gold:#E8B84B;--green:#2D6A35;--text:#F5F0E8;--muted:#7A7068;--border:rgba(255,255,255,0.07);--card:#1C1C1C;--r:18px;--r2:12px;--nav-bg:#131921;}
    html{scroll-behavior:smooth}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;padding-top:60px}
    #topnav-wrapper{position:fixed;top:0;left:0;right:0;z-index:500}
    #topnav{background:var(--nav-bg);display:flex;align-items:center;padding:0 10px;height:60px;gap:2px}
    .nav-logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:#fff;text-decoration:none;letter-spacing:-.5px;padding:5px 9px;border:2px solid transparent;border-radius:3px;flex-shrink:0;transition:border-color .15s}
    .nav-logo:hover{border-color:#fff}
    .nav-search{flex:1;display:flex;height:44px;margin:0 12px;border-radius:50px;overflow:hidden;min-width:0;background:#fff;border:2px solid transparent;transition:border-color .2s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .nav-search:focus-within{border-color:var(--red)}
    .search-icon-left{display:flex;align-items:center;padding:0 14px;background:#fff;color:#888;flex-shrink:0}
    .search-input-nav{flex:1;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:15px;color:#111;background:#fff;padding:0 8px;min-width:0}
    .search-input-nav::placeholder{color:#999}
    .search-go{background:#fff;border:none;padding:0 18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-left:1px solid #eee}
    .nav-item{display:flex;flex-direction:column;justify-content:center;padding:5px 9px;border:2px solid transparent;border-radius:3px;text-decoration:none;flex-shrink:0;transition:border-color .15s;white-space:nowrap}
    .nav-item:hover{border-color:#fff}
    .ni-top{font-size:11px;color:rgba(255,255,255,.65);line-height:1.3}
    .ni-bot{font-size:13px;font-weight:700;color:#fff;line-height:1.4}
    .nav-cart-link{display:flex;align-items:flex-end;gap:4px;padding:5px 9px;border:2px solid transparent;border-radius:3px;text-decoration:none;flex-shrink:0;transition:border-color .15s}
    .nav-cart-link:hover{border-color:#fff}
    .cart-icon-wrap{position:relative;display:inline-flex}
    #nav-badge{position:absolute;top:-4px;right:-5px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center}
    .cart-label{font-size:13px;font-weight:700;color:#fff;padding-bottom:3px}

    /* PAGE */
    .rev-wrap{max-width:980px;margin:0 auto;padding:28px 48px 80px}
    .breadcrumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:28px}
    .breadcrumb a{color:var(--muted);text-decoration:none;transition:color .15s}
    .breadcrumb a:hover{color:var(--red)}
    .breadcrumb span{color:var(--text);font-weight:500}

    /* PRODUCT HERO */
    .prod-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px 28px;display:flex;align-items:center;gap:22px;margin-bottom:32px;text-decoration:none;color:var(--text);transition:border-color .2s;position:relative;overflow:hidden}
    .prod-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 50%,rgba(212,13,13,.05) 0%,transparent 65%);pointer-events:none}
    .prod-hero:hover{border-color:rgba(212,13,13,.35)}
    .ph-emoji{font-size:64px;flex-shrink:0;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4))}
    .ph-info{flex:1}
    .ph-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--red);margin-bottom:6px}
    .ph-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px;line-height:1.1}
    .ph-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px}
    .ph-price{font-size:22px;font-weight:700;color:var(--red)}
    .ph-price span{font-size:12px;font-weight:400;color:var(--muted)}
    .ph-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0;padding:10px 16px;border:1px solid var(--border);border-radius:50px;transition:all .2s;white-space:nowrap}
    .prod-hero:hover .ph-back{border-color:rgba(212,13,13,.4);color:var(--red)}

    /* RATING OVERVIEW */
    .rating-panel{display:grid;grid-template-columns:180px 1fr;gap:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
    .rp-left{padding:32px 24px;text-align:center;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(212,13,13,.03)}
    .rp-big{font-family:'Cormorant Garamond',serif;font-size:72px;font-weight:700;color:var(--text);line-height:1}
    .rp-stars{font-size:20px;color:var(--gold);letter-spacing:3px;margin:8px 0}
    .rp-count{font-size:12px;color:var(--muted)}
    .rp-right{padding:24px 28px;display:flex;flex-direction:column;justify-content:center;gap:10px}
    .bar-row{display:flex;align-items:center;gap:12px;font-size:12px}
    .bar-label{color:var(--muted);min-width:28px;text-align:right;flex-shrink:0;font-weight:600}
    .bar-track{flex:1;height:9px;background:var(--bg3);border-radius:5px;overflow:hidden}
    .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),#f0c55a);transition:width 1.2s cubic-bezier(.22,1,.36,1)}
    .bar-pct{color:var(--muted);min-width:32px;font-size:11px;text-align:right}
    .bar-count{color:var(--muted);font-size:11px;min-width:40px}

    /* FILTER */
    .filter-row{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
    .ftab{padding:8px 20px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;transition:all .2s;cursor:pointer}
    .ftab:hover{border-color:var(--red);color:var(--red)}
    .ftab.active{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}

    /* WRITE REVIEW */
    .write-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:26px;margin-bottom:28px}
    .wb-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px}
    .wb-stars{display:flex;gap:8px;margin-bottom:16px}
    .wstar{font-size:30px;color:var(--muted);transition:color .12s,transform .12s;cursor:pointer;user-select:none}
    .wstar:hover,.wstar.lit{color:var(--gold);transform:scale(1.18)}
    .wb-textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);resize:vertical;min-height:100px;transition:border-color .2s;margin-bottom:14px}
    .wb-textarea:focus{outline:none;border-color:var(--red)}
    .wb-textarea::placeholder{color:var(--muted)}
    .wb-row{display:flex;gap:12px;align-items:center}
    .wb-name{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--text);transition:border-color .2s}
    .wb-name:focus{outline:none;border-color:var(--red)}
    .wb-name::placeholder{color:var(--muted)}
    .btn-post{background:var(--red);color:#fff;border:none;border-radius:var(--r2);padding:12px 28px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;transition:all .2s;flex-shrink:0;cursor:pointer;box-shadow:0 0 20px rgba(212,13,13,.2)}
    .btn-post:hover{background:var(--red2);transform:translateY(-1px)}

    /* REVIEW CARDS */
    .rev-list{display:flex;flex-direction:column;gap:14px}
    .rev-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;transition:border-color .2s;animation:fadeUp .35s ease both}
    .rev-card:hover{border-color:rgba(212,13,13,.2)}
    .rc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap}
    .rc-left{display:flex;align-items:center;gap:12px}
    .rc-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,rgba(212,13,13,.2),rgba(212,13,13,.05));border:1px solid rgba(212,13,13,.2);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--red);flex-shrink:0}
    .rc-name{font-weight:700;font-size:14px;margin-bottom:3px}
    .rc-stars{color:var(--gold);font-size:13px;letter-spacing:1px}
    .rc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    .rc-date{font-size:11px;color:var(--muted)}
    .rc-verified{font-size:10px;font-weight:600;color:#6BCF7F;background:rgba(45,106,53,.15);border:1px solid rgba(45,106,53,.25);border-radius:50px;padding:2px 9px}
    .rc-size{font-size:11px;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:50px;padding:3px 10px;display:inline-block;margin-bottom:10px}
    .rc-body{font-size:14px;line-height:1.7;color:var(--text);opacity:.88;margin-bottom:14px}
    .rc-foot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
    .helpful-btn{background:var(--bg2);border:1px solid var(--border);border-radius:50px;padding:4px 14px;font-family:'Outfit',sans-serif;font-size:11px;color:var(--muted);transition:all .2s;cursor:pointer}
    .helpful-btn:hover,.helpful-btn.voted{background:rgba(212,13,13,.1);border-color:rgba(212,13,13,.3);color:var(--red)}

    /* LOAD MORE */
    .load-more-btn{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;margin-top:20px;cursor:pointer}
    .load-more-btn:hover{border-color:var(--red);color:var(--red)}

    /* EMPTY */
    .no-reviews{text-align:center;padding:60px 20px;color:var(--muted)}
    .no-reviews div{font-size:48px;margin-bottom:14px}

    /* TOAST */
    #toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:50px;padding:13px 28px;font-size:14px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9998;pointer-events:none;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
    #toast.show{transform:translateX(-50%) translateY(0)}

    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

    @media(max-width:700px){
      .rev-wrap{padding:16px 20px 60px}
      .rating-panel{grid-template-columns:1fr}
      .rp-left{border-right:none;border-bottom:1px solid var(--border);flex-direction:row;gap:20px;padding:20px 24px}
      .prod-hero{flex-wrap:wrap}
      .ph-back{display:none}
    }
  </style>
</head>

  <!-- FILTER TABS -->
  <div class="filter-row">
    <button class="ftab active" onclick="filterRevs('all',this)">All Reviews</button>

    <button class="ftab" onclick="filterRevs(4,this)">★★★★☆ 4 Star</button>

  <!-- WRITE A REVIEW -->
  <div class="write-box">

    <textarea class="wb-textarea" id="wr-text" placeholder="Share your experience with this product..."></textarea>
    <div class="wb-row">
      <input type="text" class="wb-name" id="wr-name" placeholder="Your name (optional)">
      <button class="btn-post" onclick="submitReview()">Post Review</button>
    </div>
  </div>

  <!-- REVIEW LIST -->
  <div class="rev-list" id="rev-list"></div>
  <button class="load-more-btn" id="load-more-btn" onclick="loadMore()" style="display:none">Load more reviews ↓</button>
</div>

const OF = {
  getUser(){try{return JSON.parse(localStorage.getItem('of_user')||'null')}catch(e){return null}},
  cartKey(){const u=this.getUser();return u?'of_cart_'+u.id:'of_cart_guest'},
  cartCount(){try{return Object.values(JSON.parse(localStorage.getItem(this.cartKey())||'{}')).reduce((a,b)=>a+b,0)}catch(e){return 0}},
  refreshBadge(){const el=document.getElementById('nav-badge');if(el){const n=this.cartCount();el.textContent=n;el.style.display=n>0?'flex':'none'}},
  getStoredRevs(id){try{return JSON.parse(localStorage.getItem('of_revs_'+id)||'[]')}catch(e){return[]}},
  saveRevs(id,arr){localStorage.setItem('of_revs_'+id,JSON.stringify(arr))},
  _tt:null,
  toast(msg){const t=document.getElementById('toast');if(!t)return;t.innerHTML=msg;t.classList.add('show');clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('show'),2800)},
};

let currentProduct = null;
let allReviews = [];
let shownCount = 5;
let activeFilter = 'all';
let userRating = 0;

function starsHTML(r) {
  const full=Math.floor(r), half=r%1>=0.3&&r%1<0.8, empty=5-full-(half?1:0);
  return '★'.repeat(full)+(half?'½':'')+'☆'.repeat(empty);
}

function buildDistribution(revs) {
  const dist={5:0,4:0,3:0,2:0,1:0};
  revs.forEach(r=>{ const s=Math.round(r.rating); dist[s]=(dist[s]||0)+1; });
  const total = revs.length || 1;
  return [5,4,3,2,1].map(s=>({star:s,count:dist[s]||0,pct:Math.round((dist[s]||0)/total*100)}));
}

function renderBars(revs) {
  const dist = buildDistribution(revs);
  document.getElementById('rp-bars').innerHTML = dist.map(d=>`
    <div class="bar-row">
      <div class="bar-label">${d.star}★</div>
      <div class="bar-track"><div class="bar-fill" style="width:0%" data-w="${d.pct}%"></div></div>
      <div class="bar-count">${d.count.toLocaleString()}</div>
      <div class="bar-pct">${d.pct}%</div>
    </div>
  `).join('');
  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{ el.style.width=el.dataset.w; });
  });
}

function renderReviews(filter='all') {
  const toShow = filter==='all' ? allReviews :
                 filter==='critical' ? allReviews.filter(r=>r.rating<=2) :
                 allReviews.filter(r=>Math.floor(r.rating)===filter);
  const slice = toShow.slice(0, shownCount);
  const list = document.getElementById('rev-list');
  if (!slice.length) {
    list.innerHTML = `<div class="no-reviews"><div>💬</div><p>No reviews in this category yet.</p></div>`;
    document.getElementById('load-more-btn').style.display='none';
    return;
  }
  list.innerHTML = slice.map((r,i)=>`
    <div class="rev-card" style="animation-delay:${i*0.05}s">
      <div class="rc-top">
        <div class="rc-left">
          <div class="rc-avatar">${r.name?r.name[0].toUpperCase():'?'}</div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="rc-name">${r.name||'Anonymous'}</span>
              ${r.verified?'<span class="rc-verified">✓ Verified Purchase</span>':''}
            </div>
            <div class="rc-stars">${starsHTML(r.rating)}</div>
          </div>
        </div>
        <div class="rc-right">
          <div class="rc-date">${r.date||'Recent'}</div>
        </div>
      </div>
      ${r.size?`<span class="rc-size">Size: ${r.size}</span>`:''}
      <div class="rc-body">${r.text}</div>
      <div class="rc-foot">
        Helpful?
        <button class="helpful-btn${r._voted?' voted':''}" onclick="markHelpful(${allReviews.indexOf(r)},this)">${r.helpful||0} 👍</button>
      </div>
    </div>
  `).join('');
  document.getElementById('load-more-btn').style.display = toShow.length>shownCount ? 'block' : 'none';
}

function filterRevs(val, btn) {
  activeFilter=val; shownCount=5;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderReviews(val);
}

function loadMore() { shownCount+=5; renderReviews(activeFilter); }

function markHelpful(idx, btn) {
  if(btn.classList.contains('voted'))return;
  allReviews[idx].helpful=(allReviews[idx].helpful||0)+1;
  allReviews[idx]._voted=true;
  btn.classList.add('voted');
  btn.textContent=allReviews[idx].helpful+' 👍';
}

function setRating(val) {
  userRating=val;
  document.querySelectorAll('.wstar').forEach(s=>{
    s.classList.toggle('lit', parseInt(s.dataset.val)<=val);
  });
}

function submitReview() {
  if(!userRating){OF.toast('⚠️ Please select a star rating first');return;}
  const text=document.getElementById('wr-text').value.trim();
  if(!text||text.length<10){OF.toast('⚠️ Please write at least 10 characters');return;}
  const name=document.getElementById('wr-name').value.trim()||'Anonymous';
  const now=new Date();
  const dateStr=now.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][now.getMonth()]+' '+now.getFullYear();
  const rev={name,rating:userRating,text,date:dateStr,helpful:0,verified:false,size:'',_new:true};
  allReviews.unshift(rev);
  const stored=OF.getStoredRevs(currentProduct.id);
  stored.unshift(rev);
  OF.saveRevs(currentProduct.id,stored);
  // reset
  userRating=0;
  document.getElementById('wr-text').value='';
  document.getElementById('wr-name').value='';
  document.querySelectorAll('.wstar').forEach(s=>s.classList.remove('lit'));
  renderReviews(activeFilter);
  // update overview
  renderBars(allReviews);
  const avg=(allReviews.reduce((s,r)=>s+r.rating,0)/allReviews.length).toFixed(1);
  document.getElementById('rp-big').textContent=avg;
  document.getElementById('rp-stars').textContent=starsHTML(parseFloat(avg));
  document.getElementById('rp-count').textContent=allReviews.length.toLocaleString()+' ratings';
  OF.toast('✅ Your review has been posted! Thank you.');
}

function requireLogin(page){
  const token=localStorage.getItem('of_token');
  if(!token){location.href='login.html?next='+page;return;}
  location.href=page;
}

window.addEventListener('DOMContentLoaded', ()=>{
  const user=OF.getUser();
  const li=document.getElementById('nav-user-li');
  if(user&&li){li.querySelector('.ni-top').textContent='Hello, '+user.name.split(' ')[0];li.querySelector('.ni-bot').textContent='Account & Orders';}
  OF.refreshBadge();

  const id = parseInt(new URLSearchParams(window.location.search).get('id'))||1;
  const p = ALL_PRODUCTS.find(x=>x.id===id) || ALL_PRODUCTS[0];
  currentProduct = p;

  document.title = 'Reviews: '+p.name+' — O Foods';

  // Breadcrumb
  const bcCat=document.getElementById('bc-cat');
  bcCat.textContent=p.catLabel;
  bcCat.href=CAT_PAGES[p.cat]||'memu.html';
  const bcProd=document.getElementById('bc-prod');
  bcProd.textContent=p.name;
  bcProd.href='product.html?id='+p.id;

  // Hero card
  const heroLink=document.getElementById('prod-hero-link');
  heroLink.href='product.html?id='+p.id;
  document.getElementById('ph-emoji').textContent=p.emoji;
  document.getElementById('ph-cat').textContent=p.catLabel;
  document.getElementById('ph-name').textContent=p.name;
  document.getElementById('ph-desc').textContent=p.desc;
  document.getElementById('ph-price').innerHTML='₹'+p.sizes[0].price+' <span>onwards</span>';

  // Rating overview
  const reviewCount = p.reviews || Math.floor(p.rating*200 + p.id*7);
  document.getElementById('rp-big').textContent=p.rating.toFixed(1);
  document.getElementById('rp-stars').textContent=starsHTML(p.rating);
  document.getElementById('rp-count').textContent=reviewCount.toLocaleString()+' ratings';

  // Build reviews
  const base = (REV_TEMPLATES[p.id]||[]).map(r=>({...r}));
  const stored = OF.getStoredRevs(p.id);
  allReviews = [...stored, ...base];

  // Add dates to base reviews
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  allReviews.forEach((r,i)=>{
    if(!r.date){
      const d=new Date(); d.setDate(d.getDate()-Math.floor(Math.random()*120+1));
      r.date=d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
    }
  });

  renderBars(allReviews);
  renderReviews('all');

  // Star hover
  document.querySelectorAll('.wstar').forEach(s=>{
    s.addEventListener('mouseover',()=>{
      const v=parseInt(s.dataset.val);
      document.querySelectorAll('.wstar').forEach(ws=>ws.classList.toggle('lit',parseInt(ws.dataset.val)<=v));
    });
    s.addEventListener('mouseout',()=>{
      document.querySelectorAll('.wstar').forEach(ws=>ws.classList.toggle('lit',parseInt(ws.dataset.val)<=userRating));
    });
  });
});
</script>
</body>
